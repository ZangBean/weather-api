<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thời tiết</title>
    <link rel="shortcut icon" href="img/meteorology.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="loading-screen">
      <svg
        id="loading-icon"
        viewBox="0 0 64 64"
        fill="orange"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="32" cy="32" r="12" />
        <g stroke="orange" stroke-width="4" stroke-linecap="round">
          <line x1="32" y1="6" x2="32" y2="16" />
          <line x1="32" y1="48" x2="32" y2="58" />
          <line x1="6" y1="32" x2="16" y2="32" />
          <line x1="48" y1="32" x2="58" y2="32" />
          <line x1="14" y1="14" x2="22" y2="22" />
          <line x1="42" y1="42" x2="50" y2="50" />
          <line x1="14" y1="50" x2="22" y2="42" />
          <line x1="42" y1="22" x2="50" y2="14" />
        </g>
      </svg>

      <div id="loading-text">Tra cứu thời tiết</div>
    </div>

    <div class="container bg-moderate">
      <canvas id="snowCanvas" class="snow"></canvas>
      <canvas id="windCanvas"></canvas>

      <div class="form-box">
        <h2>Tra cứu thời tiết</h2>
        <input
          type="text"
          autocomplete="off"
          id="cityInput"
          placeholder="Nhập tên địa điểm"
        />
        <div class="box"></div>
        <button class="search">Xem thời tiết</button>
        <ul id="historyList"></ul>
        <div id="result"></div>
      </div>

      <div class="map">
        <div id="clock"><span id="date"></span><span id="time"></span></div>
        <iframe
          src="https://www.google.com/maps?q=16.455279,107.546213&z=7&output=embed"
          width="100%"
          height="500"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
